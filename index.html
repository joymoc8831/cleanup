<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スカッドボード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#f2efe4;
    --surface:#ffffff;
    --surface-2:#eaeee3;
    --ink:#152219;
    --ink-dim:#5c6a5f;
    --border:#d9dccc;
    --pitch:#2f8f52;
    --pitch-2:#2a7f49;
    --pitch-line:rgba(255,255,255,0.85);
    --accent:#e2a034;
    --accent-ink:#3a2504;
    --role-fw:#df5636;
    --role-mf:#2f6fd6;
    --role-dfgk:#7b4fd6;
    --danger:#c8432f;
    --shadow:0 10px 26px rgba(21,34,25,0.14);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1712;
      --surface:#182420;
      --surface-2:#1f2c27;
      --ink:#edf3ec;
      --ink-dim:#9db0a3;
      --border:#2b3a32;
      --pitch:#1f6b40;
      --pitch-2:#1a5d38;
      --pitch-line:rgba(255,255,255,0.65);
      --accent:#eab659;
      --accent-ink:#2a1c02;
      --role-fw:#ff7d5e;
      --role-mf:#6f9dff;
      --role-dfgk:#b58cff;
      --danger:#ff6f5e;
      --shadow:0 10px 26px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1712;
    --surface:#182420;
    --surface-2:#1f2c27;
    --ink:#edf3ec;
    --ink-dim:#9db0a3;
    --border:#2b3a32;
    --pitch:#1f6b40;
    --pitch-2:#1a5d38;
    --pitch-line:rgba(255,255,255,0.65);
    --accent:#eab659;
    --accent-ink:#2a1c02;
    --role-fw:#ff7d5e;
    --role-mf:#6f9dff;
    --role-dfgk:#b58cff;
    --danger:#ff6f5e;
    --shadow:0 10px 26px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html, body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP","Zen Kaku Gothic New",sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
    font-weight:900;
    margin:0;
    text-wrap:balance;
  }
  .mono, .badge, .slot .name-tag, .pill-label{
    font-family:"Oswald","Zen Kaku Gothic New",sans-serif;
  }
  button{font:inherit;}
  input, select{font:inherit;color:inherit;}

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:20px 20px 48px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .topbar{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .ball{font-size:28px;}
  .brand h1{font-size:22px; letter-spacing:0.01em;}
  .subtitle{color:var(--ink-dim); font-size:13px; margin-top:-6px;}

  .board-tabs{
    display:flex;
    align-items:center;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  .board-tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    flex:none;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-dim);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .board-tab:hover{border-color:var(--accent);}
  .board-tab.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .board-tab .count{
    font-family:"Oswald",sans-serif;
    font-size:11px;
    opacity:0.75;
  }
  .board-tab .tab-rename{
    opacity:0.45;
    font-size:11px;
    padding:2px;
    border-radius:6px;
  }
  .board-tab .tab-rename:hover{opacity:1; background:rgba(128,128,128,0.25);}
  .board-tab.active .tab-rename{opacity:0.65;}
  .board-tab.active .tab-rename:hover{opacity:1;}
  .tab-rename-input{
    font:inherit;
    font-weight:600;
    width:8ch;
    min-width:60px;
    background:transparent;
    border:none;
    border-bottom:1px solid currentColor;
    color:inherit;
    padding:0;
  }
  .tab-rename-input:focus{outline:none;}
  .board-tab-add{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:1px dashed var(--border);
    background:transparent;
    color:var(--ink-dim);
    cursor:pointer;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .board-tab-add:hover{border-color:var(--accent); color:var(--accent);}

  .layout{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
  }

  .roster-panel{position:sticky; top:16px;}
  @media (max-width:860px){ .roster-panel{position:static;} }

  .roster-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--ink);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:var(--border);}
  .btn:active{transform:scale(0.97);}
  .btn-accent{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:transparent;
  }
  .btn-accent:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent;}
  .btn.danger{color:var(--danger);}
  .btn-sm{padding:5px 9px; font-size:12px;}

  .search-input{
    width:100%;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--ink);
    margin-bottom:10px;
  }
  .search-input:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .roster-list{
    display:flex;
    flex-direction:column;
    gap:2px;
    max-height:560px;
    overflow-y:auto;
  }
  .roster-group{margin-bottom:6px;}
  .roster-group-header{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 6px 6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--ink-dim);
  }
  .roster-group-count{
    margin-left:auto;
    font-family:"Oswald",sans-serif;
    font-size:11px;
    opacity:0.75;
  }
  .roster-empty{
    color:var(--ink-dim);
    font-size:13px;
    padding:18px 6px;
    text-align:center;
  }
  .roster-empty-sm{
    padding:4px 6px 10px 6px;
    text-align:center;
    font-size:12px;
  }
  .roster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px, 1fr));
    gap:14px 8px;
    padding:4px 2px 10px;
  }
  .roster-item{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:4px 2px;
    border-radius:10px;
    text-align:center;
    cursor:default;
  }
  .roster-item:hover{background:var(--surface-2);}
  .roster-item:hover .roster-actions{opacity:1;}
  .roster-avatar{
    width:64px;height:64px;border-radius:9px;
    overflow:hidden;flex:none;
    background:var(--surface-2);
    border:1px solid var(--border);
  }
  .roster-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .roster-meta{flex:1; min-width:0; width:100%;}
  .roster-name{
    font-size:12px; font-weight:600;
    white-space:normal; text-align:center; line-height:1.25;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  }
  .roster-comment{
    font-size:10.5px;
    color:var(--ink-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:1px;
    text-align:center; width:100%;
  }
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.03em;
    padding:2px 7px;
    border-radius:6px;
    color:#fff;
  }
  .badge.role-FW{background:var(--role-fw);}
  .badge.role-MF{background:var(--role-mf);}
  .badge.role-DFGK{background:var(--role-dfgk);}
  .roster-actions{
    position:absolute;
    top:2px; right:2px;
    display:flex; gap:2px;
    opacity:0;
    transition:opacity .12s ease;
    background:var(--surface);
    border-radius:8px;
    padding:1px;
  }
  .icon-btn{
    width:26px;height:26px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--ink-dim);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .roster-actions .icon-btn{
    width:20px;height:20px;
    border-radius:6px;
    font-size:11px;
  }
  .icon-btn:hover{background:var(--border); color:var(--ink);}
  .icon-btn.danger:hover{color:var(--danger);}

  .board-panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .board-name-field{
    display:flex;
    align-items:center;
    gap:6px;
  }
  #boardNameInput{
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-weight:900;
    font-size:19px;
    background:transparent;
    border:none;
    border-bottom:2px solid var(--border);
    color:var(--ink);
    padding:2px 0;
    max-width:260px;
  }
  #boardNameInput:focus{outline:none; border-bottom-color:var(--accent);}
  #boardNameEditBtn{
    color:var(--ink-dim);
    font-size:13px;
    flex:none;
  }
  #boardNameEditBtn:hover{color:var(--ink);}
  .board-actions{display:flex; gap:8px;}

  .pitch-wrap{
    display:flex;
    justify-content:center;
  }
  .pitch{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio:340/520;
    border-radius:10px;
    overflow:hidden;
    background:linear-gradient(180deg, var(--pitch) 0%, var(--pitch-2) 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .pitch-lines{
    position:absolute; inset:0;
    width:100%; height:100%;
  }
  .stripe{
    position:absolute; left:0; right:0;
    background:rgba(255,255,255,0.035);
  }
  .slot{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    width:70px;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .slot .avatar-wrap{
    position:relative;
    width:58px;height:58px;
  }
  .slot .avatar{
    width:100%;height:100%;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:3px solid var(--pitch-line);
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease;
  }
  .slot:hover .avatar{transform:scale(1.05);}
  .slot.empty .avatar{
    border-style:dashed;
    background:rgba(255,255,255,0.1);
  }
  .slot .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .slot .plus{color:rgba(255,255,255,0.85); font-size:20px; font-weight:700;}
  .slot .pos-badge{
    position:absolute;
    top:-3px; left:-3px;
    font-size:9px;
    font-weight:700;
    padding:1px 5px;
    border-radius:7px;
    color:#fff;
    letter-spacing:0.03em;
  }
  .slot .name-tag{
    font-size:11.5px;
    font-weight:600;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.7);
    max-width:70px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .slot .role-tag{
    font-size:10px;
    color:rgba(255,255,255,0.85);
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }

  .hint{color:var(--ink-dim); font-size:12.5px; margin-top:14px; text-align:center;}

  .legend{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:10px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .legend-item{display:flex; align-items:center; gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .dot.role-FW{background:var(--role-fw);}
  .dot.role-MF{background:var(--role-mf);}
  .dot.role-DFGK{background:var(--role-dfgk);}

  .banner{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:12.5px;
    color:var(--ink-dim);
    display:none;
  }
  .banner.show{display:block;}

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(10,16,12,0.5);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--surface);
    border-radius:16px;
    padding:20px;
    width:100%;
    max-width:420px;
    max-height:86vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal h3{font-size:17px; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-dim);
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .field input[type=text]{
    width:100%;
    padding:9px 11px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--ink);
  }
  .field input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .role-select{display:flex; gap:8px;}
  .role-option{
    flex:1;
    text-align:center;
    padding:9px 4px;
    border-radius:9px;
    border:1px solid var(--border);
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    color:var(--ink-dim);
  }
  .role-option.role-FW.active{background:var(--role-fw); border-color:var(--role-fw); color:#fff;}
  .role-option.role-MF.active{background:var(--role-mf); border-color:var(--role-mf); color:#fff;}
  .role-option.role-DFGK.active{background:var(--role-dfgk); border-color:var(--role-dfgk); color:#fff;}

  .photo-row{display:flex; align-items:center; gap:14px;}
  .photo-preview{
    width:64px;height:64px;border-radius:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    overflow:hidden;
    flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .file-btn{position:relative; overflow:hidden;}
  .file-btn input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:6px;
  }

  .picker-search{margin-bottom:8px;}
  .picker-quickadd{margin-bottom:10px;}
  #quickAddToggleBtn{width:100%; justify-content:center;}
  .quickadd-form{
    display:none;
    flex-direction:column;
    gap:10px;
    margin-top:10px;
    padding:12px;
    border:1px dashed var(--border);
    border-radius:10px;
    background:var(--surface-2);
  }
  .quickadd-form .photo-row{gap:12px;}
  .quickadd-form .photo-preview{width:52px;height:52px;}
  .picker-list{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(86px, 1fr));
    gap:14px 10px;
    max-height:420px;
    overflow-y:auto;
    padding:6px 2px;
  }
  .picker-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:8px 4px;
    border-radius:12px;
    cursor:pointer;
    border:none;
    background:none;
    width:100%;
    text-align:center;
    color:var(--ink);
  }
  .picker-item:hover{background:var(--surface-2);}
  .picker-avatar{
    width:72px;height:72px;border-radius:10px;
    overflow:hidden; flex:none;
    background:var(--surface-2);
    border:1px solid var(--border);
  }
  .picker-avatar img{width:100%;height:100%;object-fit:cover;}
  .picker-meta{flex:1; min-width:0;}
  .picker-item .picker-meta{width:100%;}
  .picker-name{
    font-size:13px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .picker-item .picker-name{
    white-space:normal; text-align:center; line-height:1.25;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  }
  .picker-item .roster-comment{
    text-align:center; width:100%;
  }
  .picker-empty{color:var(--ink-dim); font-size:13px; padding:14px 6px; text-align:center; grid-column:1/-1;}

  .slot-current{
    display:flex; align-items:center; gap:10px;
    padding:8px; margin-bottom:10px;
    background:var(--surface-2);
    border-radius:10px;
  }
  .slot-current .picker-avatar{width:40px;height:40px;border-radius:9px;}

  .confirm-text{font-size:13.5px; color:var(--ink-dim); margin-bottom:16px;}

  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--danger);
    display:inline-block;
    margin-right:5px;
  }
  .status-dot.ok{background:var(--role-mf);}
  .conn-note{font-size:11.5px; color:var(--ink-dim); display:flex; align-items:center;}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="ball">⚽</span>
      <div>
        <h1>スカッドボード</h1>
        <div class="subtitle">名鑑から選手を選んで、チームごとのフォーメーションを組み立てます</div>
      </div>
    </div>
    <div class="board-tabs" id="boardTabs"></div>
  </div>

  <div class="layout">
    <aside class="panel roster-panel">
      <div class="roster-header">
        <h2>名鑑</h2>
        <button class="btn btn-accent btn-sm" id="addPlayerBtn">+ 選手を追加</button>
      </div>
      <input type="search" class="search-input" id="rosterSearch" placeholder="名前で検索">
      <div class="roster-list" id="rosterList"></div>
    </aside>

    <section class="panel board-panel">
      <div class="board-panel-header">
        <div class="board-name-field">
          <input type="text" id="boardNameInput" value="">
          <button class="icon-btn" id="boardNameEditBtn" title="名前を変更" type="button">✎</button>
        </div>
        <div class="board-actions">
          <span class="conn-note" id="connNote"><span class="status-dot" id="connDot"></span>接続中…</span>
          <button class="btn btn-ghost danger btn-sm" id="deleteBoardBtn">このボードを削除</button>
        </div>
      </div>
      <div class="pitch-wrap">
        <div class="pitch" id="pitch">
          <svg class="pitch-lines" viewBox="0 0 340 520" preserveAspectRatio="none" aria-hidden="true">
            <rect x="6" y="6" width="328" height="508" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
            <line x1="6" y1="260" x2="334" y2="260" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
            <circle cx="170" cy="260" r="42" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
            <circle cx="170" cy="260" r="2.5" fill="rgba(255,255,255,0.6)"/>
            <rect x="65" y="6" width="210" height="70" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
            <rect x="115" y="6" width="110" height="30" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

<!-- GitHub リポジトリ自体をデータ保存先にします。設定はこのファイルに書きます。README.md の手順を参照してください -->
<script src="github-config.js"></script>

<script>
// ---------- GitHub リポジトリの Contents API を、Firestore ライクな chainable API に見せかけるラッパー ----------
// (collection().doc().get/set/update/delete/add, collection().orderBy().limit().onSnapshot() など)
// データは「グループごとに1つのJSONファイル」として、このリポジトリの data/ フォルダにコミットされます。
// 保存＝GitHubへのコミットなので、外部サービス（Firebase等）は一切不要です。

function initGithubCompat(){
  var cfg = window.GITHUB_CONFIG;
  if (!cfg || !cfg.owner || String(cfg.owner).indexOf("YOUR_") === 0 || !cfg.token || String(cfg.token).indexOf("YOUR_") === 0){
    console.warn("GitHub未設定: github-config.js を編集してください（README.md参照）");
    return null;
  }

  var branch = cfg.branch || "main";
  var dataDir = String(cfg.dataDir || "data").replace(/\/+$/,"");
  var pollMs = cfg.pollIntervalMs || 12000;
  var apiBase = "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/";

  function authHeaders(accept){
    return {
      "Authorization": "token " + cfg.token,
      "Accept": accept || "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }

  function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUtf8(str){ return decodeURIComponent(escape(atob(str))); }

  function pathFor(name){ return dataDir + "/" + name + ".json"; }

  // ファイルの中身(items配列)と sha を両方取得する。
  // 1MB以下はメタデータ取得と同じリクエストで content も取れる。
  // 1MB超の場合は content が空で返ってくるので、raw で本文だけ追加取得する（写真が増えても壊れないように）。
  async function fetchFile(name){
    var url = apiBase + pathFor(name) + "?ref=" + encodeURIComponent(branch) + "&_ts=" + Date.now();
    var res = await fetch(url, {headers: authHeaders("application/vnd.github.object+json"), cache: "no-store"});
    if (res.status === 404){
      return {items: [], sha: null};
    }
    if (!res.ok){
      var errText = await res.text().catch(function(){ return ""; });
      throw new Error("github_read_failed_" + res.status + ":" + errText.slice(0,200));
    }
    var meta = await res.json();
    var text;
    if (meta.encoding === "base64" && meta.content){
      text = b64DecodeUtf8(meta.content.replace(/\n/g, ""));
    } else {
      var rawRes = await fetch(url, {headers: authHeaders("application/vnd.github.raw+json"), cache: "no-store"});
      if (!rawRes.ok) throw new Error("github_raw_read_failed_" + rawRes.status);
      text = await rawRes.text();
    }
    var items;
    try { items = JSON.parse(text); } catch(e){ items = []; }
    if (!Array.isArray(items)) items = [];
    return {items: items, sha: meta.sha || null};
  }

  async function writeFile(name, items, sha, message){
    var url = apiBase + pathFor(name);
    var body = {
      message: message || ("update " + name + ".json"),
      content: b64EncodeUtf8(JSON.stringify(items, null, 1)),
      branch: branch
    };
    if (sha) body.sha = sha;
    var res = await fetch(url, {
      method: "PUT",
      headers: Object.assign({"Content-Type":"application/json"}, authHeaders()),
      body: JSON.stringify(body)
    });
    if (!res.ok){
      var errText = await res.text().catch(function(){ return ""; });
      var err = new Error("github_write_failed_" + res.status + ":" + errText.slice(0,300));
      err.status = res.status;
      throw err;
    }
    var json = await res.json();
    return json.content ? json.content.sha : null;
  }

  // 同一コレクションへの書き込みを直列化しつつ、sha競合(409/422)時は最新を取り直してリトライする
  var writeChains = {};
  function chain(name, fn){
    var prev = writeChains[name] || Promise.resolve();
    var next = prev.then(fn, fn);
    writeChains[name] = next.catch(function(){});
    return next;
  }

  async function mutate(name, mutator, message){
    return chain(name, async function(){
      var attempts = 0;
      while (true){
        attempts++;
        var current = await fetchFile(name);
        var nextItems = mutator(current.items.slice());
        try{
          await writeFile(name, nextItems, current.sha, message);
          return nextItems;
        }catch(e){
          if ((e.status === 409 || e.status === 422) && attempts < 5) continue;
          throw e;
        }
      }
    });
  }

  function toDocSnap(item){
    var id = item.id;
    var data = Object.assign({}, item);
    delete data.id;
    return {id: id, data: function(){ return data; }, exists: true};
  }

  function sortItems(items, field, dir){
    var copy = items.slice();
    copy.sort(function(a,b){
      var av = a[field], bv = b[field];
      if (av === bv) return 0;
      if (av < bv) return dir === "desc" ? 1 : -1;
      return dir === "desc" ? -1 : 1;
    });
    return copy;
  }

  function makeCollection(name){
    var listeners = [];
    var pollTimer = null;
    var lastText = null;

    function notify(items){
      listeners.forEach(function(l){
        var view = items;
        if (l.orderField) view = sortItems(view, l.orderField, l.orderDir);
        if (l.limitN != null) view = view.slice(0, l.limitN);
        try{
          l.next({docs: view.map(toDocSnap), empty: view.length === 0});
        }catch(e){ console.error("onSnapshot handler error", e); }
      });
    }

    async function poll(force){
      try{
        var res = await fetchFile(name);
        var text = JSON.stringify(res.items);
        if (force || text !== lastText){
          lastText = text;
          notify(res.items);
        }
      }catch(e){
        listeners.forEach(function(l){ if (l.err) l.err(e); });
      }
    }

    function ensurePolling(){
      if (pollTimer) return;
      poll(true);
      pollTimer = setInterval(function(){ poll(false); }, pollMs);
    }

    function refreshSoon(){ lastText = null; poll(true); }

    function buildQuery(orderField, orderDir, limitN){
      return {
        orderBy: function(field, dir){ return buildQuery(field, dir || "asc", limitN); },
        limit: function(n){ return buildQuery(orderField, orderDir, n); },
        get: async function(){
          var res = await fetchFile(name);
          var view = res.items;
          if (orderField) view = sortItems(view, orderField, orderDir);
          if (limitN != null) view = view.slice(0, limitN);
          return {docs: view.map(toDocSnap), empty: view.length === 0};
        },
        onSnapshot: function(next, err){
          var l = {next: next, err: err, orderField: orderField, orderDir: orderDir, limitN: limitN};
          listeners.push(l);
          ensurePolling();
          return function unsubscribe(){ listeners = listeners.filter(function(x){ return x !== l; }); };
        }
      };
    }

    var base = buildQuery(null, "asc", null);
    base.doc = function(id){
      return {
        id: id,
        get: async function(){
          var res = await fetchFile(name);
          var found = res.items.find(function(it){ return it.id === id; });
          if (!found) return {exists: false, id: id, data: function(){ return undefined; }};
          return toDocSnap(found);
        },
        set: async function(data){
          await mutate(name, function(items){
            var idx = items.findIndex(function(it){ return it.id === id; });
            var doc = Object.assign({id: id}, data);
            if (idx === -1) items.push(doc); else items[idx] = doc;
            return items;
          }, "set " + name + "/" + id);
          refreshSoon();
        },
        update: async function(data){
          await mutate(name, function(items){
            var idx = items.findIndex(function(it){ return it.id === id; });
            if (idx === -1) items.push(Object.assign({id: id}, data));
            else items[idx] = Object.assign({}, items[idx], data);
            return items;
          }, "update " + name + "/" + id);
          refreshSoon();
        },
        delete: async function(){
          await mutate(name, function(items){
            return items.filter(function(it){ return it.id !== id; });
          }, "delete " + name + "/" + id);
          refreshSoon();
        }
      };
    };
    base.add = async function(data){
      var newId = name.slice(0,1) + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
      await mutate(name, function(items){
        items.push(Object.assign({id: newId}, data));
        return items;
      }, "add " + name + "/" + newId);
      refreshSoon();
      return {id: newId};
    };
    return base;
  }

  return {
    collection: function(name){ return makeCollection(name); }
  };
}

window.__initDbCompat = initGithubCompat;
</script>

<script>
(function(){
  "use strict";

  var ROLES = {
    FW:   {label:"FW",    color:"var(--role-fw)"},
    MF:   {label:"MF",    color:"var(--role-mf)"},
    DFGK: {label:"DF／GK", color:"var(--role-dfgk)"}
  };

  var SLOTS = [
    {id:"fw1", role:"FW",   label:"FW", top:27, left:18},
    {id:"fw2", role:"FW",   label:"FW", top:27, left:39},
    {id:"fw3", role:"FW",   label:"FW", top:27, left:61},
    {id:"fw4", role:"FW",   label:"FW", top:27, left:82},
    {id:"mf1", role:"MF",   label:"MF", top:40, left:18},
    {id:"mf2", role:"MF",   label:"MF", top:40, left:50},
    {id:"mf3", role:"MF",   label:"MF", top:40, left:82},
    {id:"df1", role:"DFGK", label:"DF", top:61, left:18},
    {id:"df2", role:"DFGK", label:"DF", top:61, left:50},
    {id:"df3", role:"DFGK", label:"DF", top:61, left:82},
    {id:"gk",  role:"DFGK", label:"GK", top:87, left:50}
  ];

  var AVATAR_PALETTE = ["#df5636","#2f6fd6","#7b4fd6","#2f8f52","#e2a034","#c8432f","#2f9c9c","#a34fd6"];
  var ROLE_ORDER = ["FW","MF","DFGK"];

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function isSafeImage(src){
    return typeof src === "string" && src.indexOf("data:image/") === 0 && src.length < 400000;
  }

  function hashStr(s){
    var h = 0;
    for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  function initialsFor(name){
    var trimmed = (name||"").trim();
    if (!trimmed) return "?";
    return trimmed.charAt(0);
  }

  function placeholderAvatar(name){
    var canvas = document.createElement("canvas");
    canvas.width = 200; canvas.height = 200;
    var ctx = canvas.getContext("2d");
    var color = AVATAR_PALETTE[hashStr(name||"?") % AVATAR_PALETTE.length];
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(100,100,100,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = "900 92px 'Zen Kaku Gothic New', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(initialsFor(name), 100, 112);
    return canvas.toDataURL("image/png");
  }

  function fileToSquareDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("read_failed")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("decode_failed")); };
        img.onload = function(){
          var size = 220;
          var canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext("2d");
          var side = Math.min(img.width, img.height);
          var sx = (img.width - side) / 2;
          var sy = (img.height - side) / 2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    main().catch(function(err){ console.error("init failed", err); });
  });

  function localId(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  async function main(){
    var db = (typeof window.__initDbCompat === "function") ? window.__initDbCompat() : null;

    var connDot = document.getElementById("connDot");
    var connNote = document.getElementById("connNote");

    var state = {
      roster: [],        // {id, name, position, photo, comment}
      boards: [],         // {id, name, order, assignments}
      activeBoardId: null,
      rosterQuery: "",
      pickerSlot: null,   // slot object currently choosing for
      pickerQuery: "",
      quickAddPhoto: null,
      editingPlayerId: null,
      editingPhoto: null,
      pendingDelete: null // {type:'player'|'board', id, name}
    };

    var rosterCol = db ? db.collection("roster") : null;
    var boardsCol = db ? db.collection("boards") : null;

    if (!db){
      connDot.classList.remove("ok");
      connNote.textContent = "GitHub未設定のため保存されません（README.mdの手順で設定してください）";
      seedLocalData();
    } else {
      connDot.classList.add("ok");
      connNote.textContent = "自動保存中";
      await ensureSeed();

      rosterCol.orderBy("name","asc").onSnapshot(function(snap){
        state.roster = snap.docs.map(function(d){
          var data = d.data() || {};
          return {
            id: d.id,
            name: typeof data.name === "string" ? data.name : "(名前未設定)",
            position: ROLES[data.position] ? data.position : "MF",
            photo: isSafeImage(data.photo) ? data.photo : placeholderAvatar(data.name),
            comment: typeof data.comment === "string" ? data.comment : ""
          };
        });
        renderRoster();
        renderBoard();
        if (state.pickerSlot) renderPicker();
      }, function(err){
        console.error("roster subscription error", err);
        connDot.classList.remove("ok");
        connNote.textContent = "接続エラー（github-config.jsのトークン・設定を確認してください）";
      });

      boardsCol.orderBy("order","asc").onSnapshot(function(snap){
        state.boards = snap.docs.map(function(d){
          var data = d.data() || {};
          return {
            id: d.id,
            name: typeof data.name === "string" && data.name ? data.name : "チーム",
            order: typeof data.order === "number" ? data.order : 0,
            assignments: (data.assignments && typeof data.assignments === "object") ? data.assignments : {}
          };
        });
        if (!state.activeBoardId && state.boards.length){
          state.activeBoardId = state.boards[0].id;
        }
        if (state.activeBoardId && !state.boards.some(function(b){ return b.id === state.activeBoardId; })){
          state.activeBoardId = state.boards.length ? state.boards[0].id : null;
        }
        renderBoardTabs();
        renderBoard();
      }, function(err){
        console.error("boards subscription error", err);
        connDot.classList.remove("ok");
        connNote.textContent = "接続エラー（github-config.jsのトークン・設定を確認してください）";
      });
    }

    function seedLocalData(){
      state.roster = [];
      state.boards = [];
      for (var g=1; g<=10; g++){
        state.boards.push({id: localId("b"), name: "グループ" + g, order: g, assignments: {}});
      }
      state.activeBoardId = state.boards[0].id;
      renderAll();
    }

    async function ensureSeed(){
      try{
        var boardsPeek = await boardsCol.limit(1).get();
        if (boardsPeek.empty){
          for (var g=1; g<=10; g++){
            await boardsCol.add({
              name: "グループ" + g,
              order: g,
              assignments: {},
              updatedAt: Date.now()
            });
          }
        }
      }catch(e){
        console.error("seed failed", e);
      }
    }

    // ---------- data helpers (work with or without db) ----------

    async function createPlayer(payload){
      if (db){
        payload = Object.assign({}, payload, {createdAt: Date.now()});
        var ref = await rosterCol.add(payload);
        if (!state.roster.some(function(p){ return p.id === ref.id; })){
          state.roster.push(Object.assign({id: ref.id}, payload));
          state.roster.sort(function(a,b){ return a.name.localeCompare(b.name, "ja"); });
        }
        renderRoster(); renderBoard();
        return ref.id;
      } else {
        var id = localId("p");
        state.roster.push(Object.assign({id: id}, payload));
        state.roster.sort(function(a,b){ return a.name.localeCompare(b.name, "ja"); });
        renderRoster(); renderBoard();
        return id;
      }
    }

    async function updatePlayer(id, payload){
      if (db){
        await rosterCol.doc(id).update(payload);
      } else {
        var p = state.roster.find(function(x){ return x.id === id; });
        if (p) Object.assign(p, payload);
        state.roster.sort(function(a,b){ return a.name.localeCompare(b.name, "ja"); });
        renderRoster(); renderBoard();
      }
    }

    async function deletePlayerEverywhere(id){
      if (db){
        await rosterCol.doc(id).delete();
        for (var i=0;i<state.boards.length;i++){
          var b = state.boards[i];
          if (Object.keys(b.assignments).some(function(slotId){ return b.assignments[slotId] === id; })){
            var next = Object.assign({}, b.assignments);
            Object.keys(next).forEach(function(slotId){ if (next[slotId] === id) delete next[slotId]; });
            await boardsCol.doc(b.id).set({name: b.name, order: b.order, assignments: next, updatedAt: Date.now()});
          }
        }
      } else {
        state.roster = state.roster.filter(function(p){ return p.id !== id; });
        state.boards.forEach(function(b){
          Object.keys(b.assignments).forEach(function(slotId){
            if (b.assignments[slotId] === id) delete b.assignments[slotId];
          });
        });
        renderRoster(); renderBoardTabs(); renderBoard();
      }
    }

    async function createBoard(){
      var maxOrder = state.boards.reduce(function(m,b){ return Math.max(m,b.order||0); }, 0);
      var payload = {name: "グループ" + (state.boards.length + 1), order: maxOrder + 1, assignments: {}};
      if (db){
        payload.updatedAt = Date.now();
        var ref = await boardsCol.add(payload);
        state.activeBoardId = ref.id;
      } else {
        var board = Object.assign({id: localId("b")}, payload);
        state.boards.push(board);
        state.activeBoardId = board.id;
        renderBoardTabs(); renderBoard();
      }
    }

    async function renameBoard(id, name){
      if (db){
        await boardsCol.doc(id).update({name: name, updatedAt: Date.now()});
      } else {
        var b = state.boards.find(function(x){ return x.id === id; });
        if (b) b.name = name;
        renderBoardTabs();
      }
    }

    async function deleteBoard(id){
      if (db){
        await boardsCol.doc(id).delete();
      } else {
        state.boards = state.boards.filter(function(b){ return b.id !== id; });
        if (state.activeBoardId === id){
          state.activeBoardId = state.boards.length ? state.boards[0].id : null;
        }
        renderBoardTabs(); renderBoard();
      }
    }

    async function setAssignment(board, slotId, playerId){
      var next = Object.assign({}, board.assignments);
      if (playerId) next[slotId] = playerId; else delete next[slotId];
      if (db){
        await boardsCol.doc(board.id).set({name: board.name, order: board.order, assignments: next, updatedAt: Date.now()});
      } else {
        board.assignments = next;
        renderBoardTabs(); renderBoard();
      }
    }

    // ---------- rendering ----------

    function renderAll(){
      renderBoardTabs();
      renderRoster();
      renderBoard();
    }

    function currentBoard(){
      return state.boards.find(function(b){ return b.id === state.activeBoardId; }) || null;
    }

    function renderBoardTabs(){
      var wrap = document.getElementById("boardTabs");
      wrap.innerHTML = "";
      state.boards.forEach(function(b){
        var filled = Object.keys(b.assignments || {}).length;
        var tab = document.createElement("button");
        tab.type = "button";
        tab.className = "board-tab" + (b.id === state.activeBoardId ? " active" : "");
        tab.innerHTML =
          '<span class="tab-name">' + escapeHtml(b.name) + '</span>' +
          '<span class="count">' + filled + '/' + SLOTS.length + '</span>' +
          '<span class="tab-rename" title="名前を変更">✎</span>';
        tab.addEventListener("click", function(){
          state.activeBoardId = b.id;
          renderBoardTabs();
          renderBoard();
        });
        tab.querySelector(".tab-rename").addEventListener("click", function(e){
          e.stopPropagation();
          startTabRename(tab, b);
        });
        wrap.appendChild(tab);
      });
      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "board-tab-add";
      addBtn.title = "チームボードを追加";
      addBtn.textContent = "+";
      addBtn.addEventListener("click", function(){
        createBoard().catch(function(e){ console.error("add board failed", e); });
      });
      wrap.appendChild(addBtn);
    }

    function startTabRename(tab, b){
      tab.innerHTML = '<input type="text" class="tab-rename-input" value="' + escapeHtml(b.name) + '">';
      var input = tab.querySelector(".tab-rename-input");
      input.addEventListener("click", function(e){ e.stopPropagation(); });
      input.addEventListener("keydown", function(e){
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape"){ input.dataset.cancel = "1"; input.blur(); }
      });
      input.addEventListener("blur", function(){
        var cancel = input.dataset.cancel === "1";
        var val = input.value.trim();
        if (!cancel && val && val !== b.name){
          b.name = val;
          renderBoardTabs();
          renderBoard();
          renameBoard(b.id, val).catch(function(e){ console.error("rename failed", e); });
        } else {
          renderBoardTabs();
        }
      });
      setTimeout(function(){ input.focus(); input.select(); }, 0);
    }

    function renderRoster(){
      var list = document.getElementById("rosterList");
      var q = state.rosterQuery.trim().toLowerCase();

      if (!state.roster.length){
        list.innerHTML = '<div class="roster-empty">まだ選手が登録されていません。<br>「+ 選手を追加」から登録するか、配置画面の「＋ 新しい選手を登録して配置」からも登録できます。</div>';
        return;
      }

      var html = "";
      ROLE_ORDER.forEach(function(role){
        var items = state.roster.filter(function(p){
          if (p.position !== role) return false;
          if (q && p.name.toLowerCase().indexOf(q) === -1) return false;
          return true;
        });
        html += '<div class="roster-group">' +
          '<div class="roster-group-header">' +
            '<span class="dot role-' + role + '"></span>' +
            '<span>' + ROLES[role].label + '</span>' +
            '<span class="roster-group-count">' + items.length + '</span>' +
          '</div>';
        if (!items.length){
          html += '<div class="roster-empty roster-empty-sm">' +
            (q ? '該当する選手がいません' : 'まだ登録されていません') +
          '</div>';
        } else {
          html += '<div class="roster-grid">' + items.map(function(p){
            return '' +
              '<div class="roster-item" data-id="' + escapeHtml(p.id) + '">' +
                '<div class="roster-avatar"><img src="' + escapeHtml(p.photo) + '" alt=""></div>' +
                '<div class="roster-meta">' +
                  '<div class="roster-name">' + escapeHtml(p.name) + '</div>' +
                  (p.comment ? '<div class="roster-comment">' + escapeHtml(p.comment) + '</div>' : '') +
                '</div>' +
                '<div class="roster-actions">' +
                  '<button class="icon-btn edit-player" title="編集">✎</button>' +
                  '<button class="icon-btn danger delete-player" title="削除">✕</button>' +
                '</div>' +
              '</div>';
          }).join("") + '</div>';
        }
        html += '</div>';
      });
      list.innerHTML = html;

      list.querySelectorAll(".roster-item").forEach(function(el){
        var id = el.getAttribute("data-id");
        el.querySelector(".edit-player").addEventListener("click", function(){ openPlayerModal(id); });
        el.querySelector(".delete-player").addEventListener("click", function(){
          var p = state.roster.find(function(x){ return x.id === id; });
          confirmAction("player", id, p ? p.name : "");
        });
      });
    }

    function renderBoard(){
      var board = currentBoard();
      var nameInput = document.getElementById("boardNameInput");
      nameInput.value = board ? board.name : "";
      nameInput.disabled = !board;

      var pitch = document.getElementById("pitch");
      pitch.querySelectorAll(".slot").forEach(function(el){ el.remove(); });

      SLOTS.forEach(function(slot){
        var assignedId = board ? board.assignments[slot.id] : null;
        var player = assignedId ? state.roster.find(function(p){ return p.id === assignedId; }) : null;

        var el = document.createElement("button");
        el.type = "button";
        el.className = "slot" + (player ? "" : " empty");
        el.style.top = slot.top + "%";
        el.style.left = slot.left + "%";

        if (player){
          el.innerHTML = '' +
            '<div class="avatar-wrap">' +
              '<div class="avatar"><img src="' + escapeHtml(player.photo) + '" alt=""></div>' +
              '<span class="pos-badge" style="background:' + ROLES[player.position].color + '">' + slot.label + '</span>' +
            '</div>' +
            '<span class="name-tag">' + escapeHtml(player.name) + '</span>';
        } else {
          el.innerHTML = '' +
            '<div class="avatar-wrap"><div class="avatar"><span class="plus">+</span></div></div>' +
            '<span class="role-tag">' + slot.label + '</span>';
        }

        el.addEventListener("click", function(){ openPicker(slot); });
        pitch.appendChild(el);
      });
    }

    // ---------- roster search / filter ----------

    document.getElementById("rosterSearch").addEventListener("input", function(e){
      state.rosterQuery = e.target.value;
      renderRoster();
    });

    // ---------- board name / delete ----------

    var boardNameInput = document.getElementById("boardNameInput");
    boardNameInput.addEventListener("change", async function(){
      var board = currentBoard();
      if (!board) return;
      var val = boardNameInput.value.trim() || board.name;
      boardNameInput.value = val;
      try{ await renameBoard(board.id, val); }
      catch(e){ console.error("rename failed", e); }
    });
    boardNameInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") boardNameInput.blur();
    });

    document.getElementById("boardNameEditBtn").addEventListener("click", function(){
      boardNameInput.focus();
      boardNameInput.select();
    });

    document.getElementById("deleteBoardBtn").addEventListener("click", function(){
      var board = currentBoard();
      if (!board) return;
      confirmAction("board", board.id, board.name);
    });

    // ---------- player modal ----------

    var playerModalBackdrop = document.getElementById("playerModalBackdrop");
    var playerModalTitle = document.getElementById("playerModalTitle");
    var photoPreview = document.getElementById("photoPreview");
    var photoInput = document.getElementById("photoInput");
    var playerNameInput = document.getElementById("playerNameInput");
    var roleSelect = document.getElementById("roleSelect");
    var playerCommentInput = document.getElementById("playerCommentInput");

    document.getElementById("addPlayerBtn").addEventListener("click", function(){ openPlayerModal(null); });

    function openPlayerModal(playerId){
      state.editingPlayerId = playerId;
      var player = playerId ? state.roster.find(function(p){ return p.id === playerId; }) : null;
      playerModalTitle.textContent = player ? "選手を編集" : "選手を追加";
      playerNameInput.value = player ? player.name : "";
      playerCommentInput.value = player ? (player.comment || "") : "";
      state.editingPhoto = player ? player.photo : null;
      renderPhotoPreview();
      setRolePicked(player ? player.position : "FW");
      photoInput.value = "";
      playerModalBackdrop.classList.add("show");
      setTimeout(function(){ playerNameInput.focus(); }, 30);
    }

    function renderPhotoPreview(){
      var name = playerNameInput.value || "?";
      var src = isSafeImage(state.editingPhoto) ? state.editingPhoto : placeholderAvatar(name);
      photoPreview.innerHTML = '<img src="' + escapeHtml(src) + '" alt="">';
    }

    playerNameInput.addEventListener("input", function(){
      if (!state.editingPhoto) renderPhotoPreview();
    });

    photoInput.addEventListener("change", async function(){
      var file = photoInput.files && photoInput.files[0];
      if (!file) return;
      try{
        state.editingPhoto = await fileToSquareDataUrl(file);
        renderPhotoPreview();
      }catch(e){ console.error("photo read failed", e); }
    });

    var pickedRole = "FW";
    function setRolePicked(role){
      pickedRole = role;
      roleSelect.querySelectorAll(".role-option").forEach(function(el){
        el.classList.toggle("active", el.getAttribute("data-role") === role);
      });
    }
    roleSelect.addEventListener("click", function(e){
      var el = e.target.closest(".role-option");
      if (!el) return;
      setRolePicked(el.getAttribute("data-role"));
    });

    document.getElementById("playerCancelBtn").addEventListener("click", closePlayerModal);
    function closePlayerModal(){
      playerModalBackdrop.classList.remove("show");
      state.editingPlayerId = null;
      state.editingPhoto = null;
    }

    document.getElementById("playerSaveBtn").addEventListener("click", async function(){
      var name = playerNameInput.value.trim();
      if (!name){ playerNameInput.focus(); return; }
      var photo = isSafeImage(state.editingPhoto) ? state.editingPhoto : placeholderAvatar(name);
      var comment = playerCommentInput.value.trim();
      var payload = {name: name, position: pickedRole, photo: photo, comment: comment};
      try{
        if (state.editingPlayerId){
          await updatePlayer(state.editingPlayerId, payload);
        } else {
          await createPlayer(payload);
        }
        closePlayerModal();
      }catch(e){ console.error("save player failed", e); }
    });

    // ---------- picker modal ----------

    var pickerModalBackdrop = document.getElementById("pickerModalBackdrop");
    var pickerModalTitle = document.getElementById("pickerModalTitle");
    var slotCurrent = document.getElementById("slotCurrent");
    var pickerSearch = document.getElementById("pickerSearch");
    var pickerRemoveBtn = document.getElementById("pickerRemoveBtn");
    var quickAddToggleBtn = document.getElementById("quickAddToggleBtn");
    var quickAddForm = document.getElementById("quickAddForm");
    var quickAddPhotoPreview = document.getElementById("quickAddPhotoPreview");
    var quickAddPhotoInput = document.getElementById("quickAddPhotoInput");
    var quickAddNameInput = document.getElementById("quickAddNameInput");
    var quickAddCommentInput = document.getElementById("quickAddCommentInput");
    var quickAddSubmitBtn = document.getElementById("quickAddSubmitBtn");

    function openPicker(slot){
      state.pickerSlot = slot;
      state.pickerQuery = "";
      state.quickAddPhoto = null;
      pickerSearch.value = "";
      quickAddForm.style.display = "none";
      quickAddNameInput.value = "";
      quickAddCommentInput.value = "";
      quickAddPhotoInput.value = "";
      quickAddPhotoPreview.innerHTML = "";
      quickAddToggleBtn.textContent = "＋ 新しい" + ROLES[slot.role].label + "選手を登録して配置";
      pickerModalTitle.textContent = slot.label + " を選択";
      renderPicker();
      pickerModalBackdrop.classList.add("show");
      setTimeout(function(){ pickerSearch.focus(); }, 30);
    }

    quickAddToggleBtn.addEventListener("click", function(){
      var willShow = quickAddForm.style.display !== "flex";
      quickAddForm.style.display = willShow ? "flex" : "none";
      if (willShow){
        renderQuickAddPreview();
        setTimeout(function(){ quickAddNameInput.focus(); }, 30);
      }
    });

    function renderQuickAddPreview(){
      var name = quickAddNameInput.value || "?";
      var src = isSafeImage(state.quickAddPhoto) ? state.quickAddPhoto : placeholderAvatar(name);
      quickAddPhotoPreview.innerHTML = '<img src="' + escapeHtml(src) + '" alt="">';
    }

    quickAddNameInput.addEventListener("input", function(){
      if (!state.quickAddPhoto) renderQuickAddPreview();
    });

    quickAddPhotoInput.addEventListener("change", async function(){
      var file = quickAddPhotoInput.files && quickAddPhotoInput.files[0];
      if (!file) return;
      try{
        state.quickAddPhoto = await fileToSquareDataUrl(file);
        renderQuickAddPreview();
      }catch(e){ console.error("photo read failed", e); }
    });

    quickAddSubmitBtn.addEventListener("click", async function(){
      var name = quickAddNameInput.value.trim();
      if (!name){ quickAddNameInput.focus(); return; }
      var slot = state.pickerSlot;
      if (!slot) return;
      var photo = isSafeImage(state.quickAddPhoto) ? state.quickAddPhoto : placeholderAvatar(name);
      var comment = quickAddCommentInput.value.trim();
      var payload = {name: name, position: slot.role, photo: photo, comment: comment};
      quickAddSubmitBtn.disabled = true;
      try{
        var newId = await createPlayer(payload);
        await assignSlot(slot.id, newId);
      }catch(e){
        console.error("quick add failed", e);
      }finally{
        quickAddSubmitBtn.disabled = false;
      }
    });

    function renderPicker(){
      var board = currentBoard();
      var slot = state.pickerSlot;
      if (!slot) return;
      var currentId = board ? board.assignments[slot.id] : null;
      var currentPlayer = currentId ? state.roster.find(function(p){ return p.id === currentId; }) : null;

      if (currentPlayer){
        slotCurrent.style.display = "flex";
        slotCurrent.innerHTML = '' +
          '<div class="picker-avatar"><img src="' + escapeHtml(currentPlayer.photo) + '" alt=""></div>' +
          '<div class="picker-meta">' +
            '<div class="roster-name">' + escapeHtml(currentPlayer.name) + '</div>' +
            '<div class="roster-comment">現在の配置' + (currentPlayer.comment ? (' ・ ' + escapeHtml(currentPlayer.comment)) : '') + '</div>' +
          '</div>';
        pickerRemoveBtn.style.display = "inline-flex";
      } else {
        slotCurrent.style.display = "none";
        pickerRemoveBtn.style.display = "none";
      }

      var usedIds = board ? Object.keys(board.assignments).filter(function(k){ return k !== slot.id; }).map(function(k){ return board.assignments[k]; }) : [];
      var q = state.pickerQuery.trim().toLowerCase();
      var candidates = state.roster.filter(function(p){
        if (p.position !== slot.role) return false;
        if (usedIds.indexOf(p.id) !== -1) return false;
        if (q && p.name.toLowerCase().indexOf(q) === -1) return false;
        return true;
      });

      var list = document.getElementById("pickerList");
      if (!candidates.length){
        list.innerHTML = '<div class="picker-empty">該当する選手がいません（名鑑に' + ROLES[slot.role].label + 'を追加してください）</div>';
        return;
      }
      list.innerHTML = candidates.map(function(p){
        return '' +
          '<button type="button" class="picker-item" data-id="' + escapeHtml(p.id) + '">' +
            '<div class="picker-avatar"><img src="' + escapeHtml(p.photo) + '" alt=""></div>' +
            '<div class="picker-meta">' +
              '<div class="picker-name">' + escapeHtml(p.name) + '</div>' +
              (p.comment ? '<div class="roster-comment">' + escapeHtml(p.comment) + '</div>' : '') +
            '</div>' +
          '</button>';
      }).join("");

      list.querySelectorAll(".picker-item").forEach(function(el){
        el.addEventListener("click", function(){
          assignSlot(slot.id, el.getAttribute("data-id"));
        });
      });
    }

    pickerSearch.addEventListener("input", function(e){
      state.pickerQuery = e.target.value;
      renderPicker();
    });

    async function assignSlot(slotId, playerId){
      var board = currentBoard();
      if (!board) return;
      try{
        await setAssignment(board, slotId, playerId);
        closePicker();
      }catch(e){ console.error("assign failed", e); }
    }

    pickerRemoveBtn.addEventListener("click", function(){
      var slot = state.pickerSlot;
      if (slot) assignSlot(slot.id, null);
    });

    document.getElementById("pickerCloseBtn").addEventListener("click", closePicker);
    function closePicker(){
      pickerModalBackdrop.classList.remove("show");
      state.pickerSlot = null;
    }

    // ---------- confirm modal ----------

    var confirmModalBackdrop = document.getElementById("confirmModalBackdrop");
    var confirmText = document.getElementById("confirmText");
    var confirmOkBtn = document.getElementById("confirmOkBtn");

    function confirmAction(type, id, name){
      state.pendingDelete = {type:type, id:id, name:name};
      confirmText.textContent = type === "player"
        ? ('「' + name + '」を名鑑から削除します。配置済みのボードからも外れます。よろしいですか？')
        : ('「' + name + '」のチームボードを削除します。よろしいですか？');
      confirmModalBackdrop.classList.add("show");
    }

    document.getElementById("confirmCancelBtn").addEventListener("click", function(){
      confirmModalBackdrop.classList.remove("show");
      state.pendingDelete = null;
    });

    confirmOkBtn.addEventListener("click", async function(){
      var pending = state.pendingDelete;
      confirmModalBackdrop.classList.remove("show");
      state.pendingDelete = null;
      if (!pending) return;
      try{
        if (pending.type === "player"){
          await deletePlayerEverywhere(pending.id);
        } else {
          await deleteBoard(pending.id);
        }
      }catch(e){ console.error("delete failed", e); }
    });

    [playerModalBackdrop, pickerModalBackdrop, confirmModalBackdrop].forEach(function(backdrop){
      backdrop.addEventListener("click", function(e){
        if (e.target === backdrop){
          if (backdrop === playerModalBackdrop) closePlayerModal();
          else if (backdrop === pickerModalBackdrop) closePicker();
          else { backdrop.classList.remove("show"); state.pendingDelete = null; }
        }
      });
    });

  }
})();
</script>

</body>
</html>
